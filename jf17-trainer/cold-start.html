<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JF-17 冷启动顺序表 · 手册 §2.2–§2.4 逐条核对版</title>
<style>
/* 纯深色主题：用户 IDE 为暗色，按长期约定不提供浅色切换 */
:root{
  --bg:#0a0d12; --bg2:#0e131b; --card:#141b25; --card2:#1a2331; --card3:#202b3b;
  --line:#2a3749; --line2:#3a4a60; --fg:#e9f0f8; --dim:#a1b2c7; --faint:#7488a0;
  --acc:#58a6ff; --acc-bg:rgba(88,166,255,.12); --acc-rgb:88,166,255;
  --ok:#3fb950; --ok-bg:rgba(63,185,80,.12);
  --bad:#f85149; --bad-bg:rgba(248,81,73,.12);
  --warn:#e3b341; --warn-bg:rgba(227,179,65,.12);
  --purple:#d2a8ff; --purple-bg:rgba(210,168,255,.12);
  --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;padding-bottom:70px}
a{color:var(--acc)}
button,input,select{font:inherit;color:inherit}
h2{font-size:20px;margin:0 0 4px;letter-spacing:.3px}
h3{font-size:15px;margin:18px 0 8px;color:var(--fg)}
h4{font-size:13px;margin:12px 0 6px;color:var(--acc)}
p{margin:8px 0}
.muted{color:var(--dim)}
.faint{color:var(--faint);font-size:12px}
.mono{font-family:var(--mono)}
.lead{color:var(--dim);margin:0 0 14px;font-size:13px}
.tag{display:inline-block;padding:1px 7px;border:1px solid var(--line2);border-radius:20px;font-size:11px;color:var(--dim);background:var(--card2);white-space:nowrap}
.tag.cockpit{color:var(--dim);border-color:#3a4a60}
.tag.ipad{color:#9fd0ff;border-color:#31567c;background:var(--acc-bg)}
.tag.phone{color:#8ee39a;border-color:#2f6b39;background:var(--ok-bg)}
.tag.cmd{color:var(--purple);border-color:#5c447c;background:var(--purple-bg)}
.tag.pit{color:#f0c661;border-color:#6b5730;background:var(--warn-bg)}
.tag.ok{color:#8ee39a;border-color:#2f6b39;background:var(--ok-bg)}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(10,13,18,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.top-in{max-width:1280px;margin:auto;padding:9px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:16px;font-weight:700;letter-spacing:.4px}
.brand small{display:block;font-size:11px;font-weight:400;color:var(--faint);letter-spacing:0}
.prog{display:flex;align-items:center;gap:9px;margin-left:auto;min-width:210px}
.prog-num{font:700 17px/1.3 var(--mono);color:var(--acc);white-space:nowrap}
.prog-num small{font:400 11px/1 system-ui;color:var(--faint)}
.bar{flex:1;min-width:90px;height:7px;border-radius:6px;background:var(--card3);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f7fd0,var(--ok));transition:width .25s}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{min-height:30px;padding:4px 10px;border:1px solid var(--line2);border-radius:7px;background:var(--card2);cursor:pointer;font-size:12px;white-space:nowrap}
button:hover{border-color:var(--acc);color:var(--acc)}
button.primary{background:var(--acc-bg);border-color:#31567c;color:#9fd0ff}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
button.on{background:var(--ok-bg);border-color:#2f6b39;color:#8ee39a}
.chips{max-width:1280px;margin:auto;padding:0 10px 8px;display:flex;gap:5px;overflow-x:auto}
.chip{padding:4px 10px;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--dim);cursor:pointer;white-space:nowrap;font-size:12px}
.chip:hover{color:var(--fg);background:var(--card)}
.chip.on{color:var(--acc);border-color:#31567c;background:var(--acc-bg)}
.chip b{font-family:var(--mono);color:var(--faint);margin-right:4px}
.chip.on b{color:var(--acc)}
.tools{max-width:1280px;margin:auto;padding:0 16px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input[type=search]{width:230px;background:var(--card2);border:1px solid var(--line2);border-radius:7px;padding:5px 9px;outline:none}
.tools input[type=search]:focus{border-color:var(--acc)}
.hint{font-size:12px;color:var(--faint)}

main{max-width:1280px;margin:0 auto;padding:16px}
section{margin:0 0 26px;scroll-margin-top:110px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.sec-head .no{font:700 13px/1 var(--mono);color:var(--acc);border:1px solid #31567c;background:var(--acc-bg);border-radius:6px;padding:5px 8px}
.sec-head .ref{font-size:12px;color:var(--faint);font-family:var(--mono)}
.sec-head .cnt{margin-left:auto;font:700 13px/1 var(--mono);color:var(--dim)}
.sec-head .cnt.done{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.hr{height:1px;background:var(--line);margin:14px 0}
details{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;margin:8px 0}
details[open]{background:var(--card)}
summary{cursor:pointer;color:var(--acc);font-size:12.5px;font-weight:600;outline:none}
details ul{margin:8px 0 4px;padding-left:20px}
details li{margin:4px 0;color:var(--dim)}
details p{color:var(--dim);margin:8px 0 2px}

/* ---------- 阶段依赖链 ---------- */
.chain{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch;margin:10px 0 4px}
.chain .lk{flex:1 1 130px;min-width:120px;background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;position:relative}
.chain .lk b{display:block;font:700 12px/1.4 var(--mono);color:var(--acc)}
.chain .lk span{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.chain .arw{align-self:center;color:var(--faint);font-size:14px}

/* ---------- 顺序表 ---------- */
.grp{margin:0 0 16px}
.grp-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 7px}
.grp-t h3{margin:0;font-size:14px}
.grp-t .ref{font:12px var(--mono);color:var(--faint)}
.tblwrap{width:100%;overflow-x:auto}
table.rt{border-collapse:collapse;table-layout:fixed;width:100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden}
table.rt col.c-chk{width:5%} col.c-no{width:6%} col.c-act{width:33%} col.c-tgt{width:20%} col.c-pos{width:14%} col.c-ref{width:11%} col.c-dev{width:11%}
table.rt th{background:var(--card3);color:var(--dim);font-size:11.5px;font-weight:600;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2)}
table.rt td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px;word-break:break-word;overflow-wrap:anywhere}
table.rt code{font-family:var(--mono);font-size:12px;background:var(--card3);padding:1px 4px;border-radius:4px;white-space:normal}
table.rt tr.main:hover td{background:rgba(var(--acc-rgb),.05)}
table.rt tr.main.done td{background:rgba(63,185,80,.05)}
table.rt tr.main.done .act{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
table.rt tr.detail td{padding:0 9px 8px;background:var(--card);border-bottom:1px solid var(--line)}
table.rt tr.detail details{margin:0}
table.rt tr.main.hide,table.rt tr.detail.hide{display:none}
.chk{width:16px;height:16px;accent-color:var(--ok);cursor:pointer;margin:2px 0 0}
.no{font:700 12px/1.5 var(--mono);color:var(--acc)}
.tgt{color:var(--fg)}
.pos{color:var(--dim);font-size:12px}
.ref{font:11.5px/1.5 var(--mono);color:var(--faint);white-space:normal}
.pitmark{cursor:pointer;color:var(--warn);font-size:12px;margin-left:5px;white-space:nowrap}
.dl{margin:6px 0 2px}
.dl dt{color:var(--acc);font-size:12px;font-weight:600;margin-top:7px}
.dl dd{margin:2px 0 0;color:var(--dim);font-size:12.5px;padding-left:12px}

/* ---------- 卡点 ---------- */
.pitcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:9px;padding:11px 14px;margin-bottom:11px}
.pitcard h3{margin:0 0 5px;font-size:14px;color:var(--fg)}
.pitcard .symptom{color:var(--warn);font-size:12.5px;margin:0 0 6px}
.pitcard .cause{color:var(--dim);font-size:13px;margin:0}
.pitcard .fix{color:#8ee39a;font-size:12.5px;margin:6px 0 0}
.pitcard .fix b{color:var(--fg)}

/* ---------- 窄屏：表转卡片 ---------- */
@media(max-width:860px){
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt colgroup,table.rt thead{display:none}
  table.rt{border:0;background:transparent}
  table.rt tr.main{border:1px solid var(--line);border-radius:9px;background:var(--card);margin:0 0 0;padding:8px 10px}
  table.rt tr.detail{border:1px solid var(--line);border-top:0;border-radius:0 0 9px 9px;margin:-2px 0 9px;padding:0 10px 8px;background:var(--card)}
  table.rt td{border:0;padding:2px 0}
  table.rt td:before{content:attr(data-l);display:inline-block;min-width:62px;color:var(--faint);font-size:11px;vertical-align:top}
  table.rt td.c-chk{display:inline-block;width:auto}
  table.rt td.c-chk:before{display:none}
  table.rt td.c-no{display:inline-block;width:auto}
  table.rt td.c-no:before{display:none}
  table.rt tr.detail td:before{display:none}
}
/* ---------- 打印：全部展开、去掉交互；深色底浅色字（固定主题，不反色） ---------- */
@media print{
  html,body{background:var(--bg) !important;color:var(--fg) !important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  body{padding:0;font-size:10.5px}
  .noprint{display:none !important}
  main{max-width:none;padding:0}
  section{break-inside:auto;margin-bottom:12px;scroll-margin-top:0}
  .card,.pitcard,table.rt,table.rt tr,table.rt td,table.rt th,details,.chain .lk{background:var(--card) !important;color:var(--fg) !important;box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .muted,.faint,.pos,.ref,.lead,.dl dd,details li,details p{color:var(--dim) !important}
  .tag{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  table.rt tr.main.hide,table.rt tr.detail.hide{display:table-row !important}
  table.rt{break-inside:auto}
  table.rt tr{break-inside:avoid}
  details{break-inside:avoid}
  @page{margin:12mm 10mm}
}
</style>
</head>
<body>

<header class="top noprint">
  <div class="top-in">
    <div class="brand">JF-17 冷启动顺序表<small>按《DCS: JF-17 飞行手册 CN》正文 §2.2 → §2.4 顺序 · 逐条可勾选</small></div>
    <div class="prog">
      <span class="prog-num" id="pnum">0 / 0 <small>步</small></span>
      <span class="bar"><i id="pbar"></i></span>
    </div>
    <div class="btns">
      <button id="btnNext" class="primary">跳到未完成</button>
      <button id="btnAll">展开全部依据</button>
      <button id="btnUndo">仅看未完成</button>
      <button id="btnPrint">打印 / 存 PDF</button>
      <button id="btnReset" class="danger">重置勾选</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="搜索步骤 / 开关 / 页码 / 卡点…">
    <span class="hint" id="qinfo">输入即时筛选，折叠里的依据也会一起搜</span>
    <span class="hint" id="saveinfo"></span>
  </div>
</header>

<main id="main"></main>

<script>
/* ============================================================
   数据：全部取自《DCS: JF-17 雷电 飞行手册 CN》正文印刷编号
   正文印刷 §2.2 = 目录 2.1（p122–136）
   正文印刷 §2.3 = 目录 2.2（p137–156）
   正文印刷 §2.4 = 目录 2.3（p157–166）
   页脚印刷页码；PDF 页码 = 印刷页码 + 8
   dev: cockpit=必须回座舱点 / ipad=panel.html 已有键 / phone=Android 已有按钮 / cmd=可走 POST /cmd 但当前 UI 未做按钮
   ============================================================ */
const STAGES = [
 {no:'A', id:'sA', title:'开车前座舱检查', ref:'§2.2 p122–136',
  lead:'冷暗座舱逐面板归位。这一阶段全是物理开关，iPad / 手机一个都帮不上——必须鼠标点座舱。手册把它排在开车之前，因为构型、刹车、燃油阀这些一旦漏设，后面告警灯会一直亮。',
  groups:[
   {t:'A1 · 左控制台', ref:'§2.2.1 p122–127', rows:[
    {act:'混合控制盒：<b>SHARS</b> 捷联航姿开关 → SHARS（接通）；<b>EMG HYD</b> 应急液压泵 → OFF', tgt:'SHARS 接通 / EMG HYD OFF', pos:'左控制台 · 混合控制盒', ref:'p123', dev:'cockpit',
     why:'SHARS 是航姿系统的备份源，先接通才能在 §2.3.3 里开始约 1 分钟的对准。'},
    {act:'飞控控制盒 5 项：<b>DIR LNK</b> → OFF；<b>构型开关 Ⅰ / Ⅱ</b> → 按外挂选位；模拟备份 → AUTO；横航向增稳切除 → R/Y AUG', tgt:'OFF / 按挂载 / AUTO / R/Y AUG', pos:'左控制台 · 飞控控制盒', ref:'p123', dev:'cockpit', pit:'CONFIG',
     why:'构型开关 Ⅰ（AA/AG）在 A/A 位时<b>完全忽略</b>开关 Ⅱ（AG1/AG2）的位置：只把 Ⅱ 拨到 AG2、Ⅰ 留在 A/A 等于白设。凡挂空地武器或副油箱 → Ⅰ 必须到 A/G；有机翼副油箱 → Ⅱ 到 A/G2，否则 A/G1；全空空 → A/A。手册 §2.4.2 p160 在滑出前<b>还会再要求核一次</b>。',
     extra:'漏掉这步是冷启动后 CONFIG 红灯常亮的头号根因；主警告灯复位只是静音，根因不除会再亮。判定见手册 §8.1 p300 / §8.5.2 p313。'},
    {act:'发动机电气控制盒：<b>ENG CTRL</b> → 下位 OFF；<b>AIR</b> 空中起动 → 下位断开；A/B → 上位接通；A/SURGE → 上位接通；SEC → 下位 OFF；工作状态 / 运转方式按任务', tgt:'ENG CTRL OFF · 其余按位', pos:'左控制台 · 发动机电气控制盒', ref:'p124', dev:'cockpit',
     why:'ENG CTRL 此刻必须 OFF，到 §2.3.13 开车那一步才接通。'},
    {act:'油门操纵台：电磁铁机构的应急按钮 → <b>拔起</b>', tgt:'拔起', pos:'左控制台 · 油门操纵台', ref:'p125', dev:'cockpit'},
    {act:'燃油控制盒：<b>ACTIVE</b> → ACTIVE；<b>FEED</b> → FEED；<b>START PUMP</b> → OFF', tgt:'ACTIVE / FEED / OFF', pos:'左控制台 · 燃油控制盒', ref:'p125', dev:'cockpit',
     why:'此处的 FEED 是燃油阀，与 SMS 页机炮 FEED 充弹同名但不是一回事。'},
    {act:'起飞着陆控制盒：<b>BRAKE</b> → ON 并置 <b>PARK</b>；<b>TEF</b> 前缘襟翼 → OFF', tgt:'ON / PARK / TEF OFF', pos:'左控制台 · 起飞着陆控制盒', ref:'p126', dev:'cockpit',
     why:'PARK 要一直保持到 §2.4.5 滑出前才切 NORM。'},
    {act:'左侧壁板 <b>氧气阀门 → 打开</b>', tgt:'打开', pos:'左侧壁板', ref:'p126 · §2.3.6 p147', dev:'cockpit'},
    {act:'军械开关盒：<b>GND JETT</b> → OFF；PANIC 保护盖关闭；<b>MASTER</b> → OFF', tgt:'全部 OFF / 盖关闭', pos:'左控制台 · 军械开关盒', ref:'p127', dev:'cockpit'},
    {act:'<b>LG</b> 起落架开关 → DOWN；<b>SAIU</b> → OFF', tgt:'LG DOWN / SAIU OFF', pos:'左前 / 左控制台', ref:'p127', dev:'ipad',
     why:'起落架手柄是 panel.html 已有的 7 个座舱快捷按钮之一；SAIU 仍需回座舱点。'}
   ]},
   {t:'A2 · 前仪表台', ref:'§2.2.2 p128–130', rows:[
    {act:'阻力伞开关 → <b>中立</b>；<b>EMER BRK</b> 应急刹车手柄 → 关闭', tgt:'中立 / 关闭', pos:'前仪表台', ref:'p129', dev:'cockpit'},
    {act:'UFCP 五个旋钮：HUD CONT / HUD BRT / UFCP BRT → <b>中间</b>；步进开关 → <b>中立</b>；<b>BAK BRT</b> → <b>OFF（全左）</b>', tgt:'三中 / 中立 / BAK BRT OFF', pos:'前仪表台 · UFCP 正前方控制板', ref:'p129–130', dev:'cockpit', pit:'HUD',
     why:'<b>BAK BRT 不在 OFF 是冷启动后 HUD 角度刻度消失的头号根因</b>：它把 HUD 整页切到备用光栅页（只剩一个固定光环），不是局部隐藏符号。panel.html 把该旋钮标作 STBY RET，且四个 UFCP 旋钮目前<b>只是示意、点不动</b>，必须回座舱拧或走 /cmd（dev 46, cmd 3233, val 0 = OFF）。',
     extra:'同一现象的次要成因：AAP 的 HUD 防拥开关不在 NORM（A3）、主模式不是 NAV（G）、INS 未完成对准出现 ALIGN。'},
    {act:'三个多功能显示器（左 / 中 / 右）<b>电源开关 → 打开</b>', tgt:'三屏 PWR 打开', pos:'前仪表台 · 三块 MFD', ref:'p130', dev:'cockpit',
     why:'注意 §2.2.2 在座舱检查阶段就要求打开；§2.3.2 p138 又说「AAP 启动后分别打开三个 MFD 以及 UFCP 和 HUD 的开关」，两处口径略重，实操按先置位、上电后确认画面即可。'}
   ]},
   {t:'A3 · 右控制台', ref:'§2.2.3 p131–136', rows:[
    {act:'冷气双针气压表：主 / 应急气动系统压力应在 <b>1600–1900 PSI</b>', tgt:'1600–1900 PSI', pos:'右控制台', ref:'p132', dev:'cockpit'},
    {act:'告警灯盒面板：DAY/NIGHT 按需；<b>BRT 调节旋钮 → 中间</b>', tgt:'BRT 中间', pos:'右控制台 · 告警灯盒面板', ref:'p132', dev:'cockpit'},
    {act:'电源操纵控制盒：<b>AC GEN / DC GEN / BATT</b> → 接通位置', tgt:'三开关接通', pos:'右控制台 · 电源操纵控制盒', ref:'p133', dev:'cockpit',
     why:'与 §2.3.1 开车第一步完全同一组开关。手册在「座舱检查」和「开车」各写一次；本表在 A 阶段置位、B 阶段做上电确认，<b>不是要做两遍</b>。'},

/* ==== @engine:start 纯逻辑：进度计算（不碰 DOM / localStorage） ==== */
function progressOf(ids, done){
  const total = ids.length;
  const n = ids.reduce((a, id) => a + (done.indexOf(id) >= 0 ? 1 : 0), 0);
  return { total: total, done: n, pct: total ? Math.round(n * 100 / total) : 0 };
}
/* ==== @engine:end ==== */

function updateProgress(){
  const p = progressOf(ALL_IDS, done);
  document.getElementById('pnum').innerHTML = p.done + ' / ' + p.total + ' <small>步 · ' + p.pct + '%</small>';
  document.getElementById('pbar').style.width = p.pct + '%';
  STAGES.forEach(s => {
    const ids = s.groups.reduce((a, g) => a.concat(g.rows.map(r => r._id)), []);
    const q = progressOf(ids, done);
    const el = document.querySelector('[data-cnt="' + s.no + '"]');
    if (el) { el.textContent = q.done + ' / ' + q.total; el.className = 'cnt' + (q.done === q.total ? ' done' : ''); }
  });
}
function applyFilter(){
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  const rows = document.querySelectorAll('tr.main');
  let shown = 0;
  rows.forEach(m => {
    const d = document.querySelector('tr.detail[data-for="' + m.getAttribute('data-id') + '"]');
    const text = (m.textContent + ' ' + (d ? d.textContent : '')).toLowerCase();
    const okQ = !q || text.indexOf(q) >= 0;
    const okU = !onlyUndo || !m.classList.contains('done');
    const vis = okQ && okU;
    m.classList.toggle('hide', !vis);
    if (d) d.classList.toggle('hide', !vis);
    if (vis) shown++;
    if (d) {
      const de = d.querySelector('details');
      if (de) {
        if (vis && q && !de.open) { de.open = true; de.dataset.auto = '1'; }
        else if (!q && de.dataset.auto === '1' && !allOpen) { de.open = false; delete de.dataset.auto; }
      }
    }
  });
  document.getElementById('qinfo').textContent = q ? ('命中 ' + shown + ' 步（含折叠依据）') : (onlyUndo ? '仅看未完成 · 剩 ' + shown + ' 步' : '输入即时筛选，折叠里的依据也会一起搜');
}
function setAllOpen(open){
  allOpen = open;
  document.querySelectorAll('tr.detail details, .pitcard details').forEach(d => d.open = open);
  document.getElementById('btnAll').textContent = open ? '收起全部依据' : '展开全部依据';
  document.getElementById('btnAll').classList.toggle('on', open);
}
function gotoNext(){
  const m = Array.from(document.querySelectorAll('tr.main')).find(x => !x.classList.contains('done'));
  if (!m) { toast('全部 ' + ALL_IDS.length + ' 步已完成'); return; }
  const sec = m.closest('section');
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.getAttribute('data-sec') === sec.id));
  const y = m.getBoundingClientRect().top + window.scrollY - 130;
  window.scrollTo({top:y, behavior:'smooth'});
  m.style.boxShadow = 'inset 3px 0 0 var(--acc)';
  setTimeout(() => { m.style.boxShadow = ''; }, 1800);
}
function toast(msg){
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;background:var(--card3);border:1px solid var(--line2);border-radius:9px;padding:9px 16px;box-shadow:var(--shadow);font-size:13px'; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._tm); t._tm = setTimeout(() => { t.style.display = 'none'; }, 2600);
}

document.addEventListener('change', e => {
  const c = e.target.closest('input.chk'); if (!c) return;
  const id = c.getAttribute('data-id');
  const i = done.indexOf(id);
  if (c.checked && i < 0) done.push(id);
  if (!c.checked && i >= 0) done.splice(i, 1);
  save();
  const m = document.querySelector('tr.main[data-id="' + id + '"]');
  if (m) m.classList.toggle('done', c.checked);
  updateProgress(); applyFilter();
});
document.getElementById('q').addEventListener('input', applyFilter);
document.getElementById('btnAll').addEventListener('click', () => setAllOpen(!allOpen));
document.getElementById('btnPrint').addEventListener('click', () => { setAllOpen(true); window.print(); });
document.getElementById('btnNext').addEventListener('click', gotoNext);
document.getElementById('btnUndo').addEventListener('click', () => {
  onlyUndo = !onlyUndo;
  const b = document.getElementById('btnUndo');
  b.textContent = onlyUndo ? '仅看未完成 · 开' : '仅看未完成';
  b.classList.toggle('on', onlyUndo);
  applyFilter();
});

/* 重置：二次确认（4 秒自动复位），破坏性操作 */
document.getElementById('btnReset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (b.dataset.armed !== '1') {
    b.dataset.armed = '1'; b.textContent = '再点一次确认清空'; b.style.borderColor = 'var(--bad)';
    clearTimeout(confirmTimer);
    confirmTimer = setTimeout(() => { b.dataset.armed = '0'; b.textContent = '重置勾选'; b.style.borderColor = ''; }, 4000);
    return;
  }
  clearTimeout(confirmTimer); b.dataset.armed = '0'; b.textContent = '重置勾选'; b.style.borderColor = '';
  done = []; save();
  document.querySelectorAll('input.chk').forEach(c => c.checked = false);
  document.querySelectorAll('tr.main').forEach(m => m.classList.remove('done'));
  updateProgress(); applyFilter(); toast('已清空全部勾选');
});

document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) {
    const id = chip.getAttribute('data-sec');
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
    const sec = document.getElementById(id);
    if (sec) window.scrollTo({top: sec.getBoundingClientRect().top + window.scrollY - 112, behavior:'smooth'});
    return;
  }
  const pm = e.target.closest('.pitmark');
  if (pm) {
    const tr = pm.closest('tr.main');
    const d = document.querySelector('tr.detail[data-for="' + tr.getAttribute('data-id') + '"] details');
    if (d) { d.open = true; d.scrollIntoView({block:'nearest', behavior:'smooth'}); }
  }
});

/* Ctrl+P / 系统打印也自动展开折叠，保证纸面完整 */
window.addEventListener('beforeprint', () => { document.querySelectorAll('details').forEach(d => d.open = true); });
window.addEventListener('afterprint', () => { setAllOpen(allOpen); });

render();
document.querySelector('.chip').classList.add('on');
</script>
</body>
</html>
