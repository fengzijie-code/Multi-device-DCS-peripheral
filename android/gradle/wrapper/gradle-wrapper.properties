distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# 官方源 services.gradle.org 会 307 重定向到 github.com/releases，
# 而这个网络环境连不上 GitHub（实测连接超时 21 秒），所以改用腾讯云镜像。
# 如果你的网络能直连 GitHub，可以换回：
#   https://services.gradle.org/distributions/gradle-9.9.0-bin.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.9.0-bin.zip

networkTimeout=60000
retries=2
retryBackOffMs=1000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
